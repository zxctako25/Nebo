[package]
name = "Nebo"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1"
hex = "0.4.3"
anyhow = "1"
ab_glyph = "0.2.32"
base64 = "0.22"
bytes = "1"
env_logger = "0.11"
flate2 = "1"
hmac = "0.12"
md-5 = "0.10"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
windows = "0.62.2"

